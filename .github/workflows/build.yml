name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and self-test
        shell: powershell
        run: .\build.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: FontDrop
          path: bin/FontDrop.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/FontDrop.exe --title "FontDrop $GITHUB_REF_NAME" --generate-notes
