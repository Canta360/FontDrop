name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and self-test
        shell: powershell
        run: .\build.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: FontDrop
          path: bin/FontDrop.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $name = "FontDrop-$($tag.TrimStart('v')).exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item bin\FontDrop.exe "release\$name"
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$PWD\release\$name.sha256", "$hash  $name`r`n")
          $notes = ".github\release-notes\$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag "release\$name" "release\$name.sha256" --title "FontDrop $($tag.TrimStart('v'))" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
